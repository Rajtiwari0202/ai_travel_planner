services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/travelagenticai.sqlite3
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ENABLE_LIVE_WEATHER: "false"
    ports:
      - "8000:8000"
    volumes:
      - travelagenticai-data:/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  travelagenticai-data:
